server:
  port: 8070

spring:
  application:
    name: VozClienteBackEnd
  datasource:
    url: jdbc:postgresql://postgres-db:5432/voz_cliente_db
    username: postgres
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  # LA CONFIGURACIÓN DE IA VA AQUÍ, DENTRO DE "spring:"
  ai:
    retry:
      max-attempts: 5
      backoff:
        initial-interval: 2000ms
        multiplier: 2.0
        max-interval: 10000ms
    google:
      genai:
        api-key: ${GEMINI_API_KEY} # Lee la variable de entorno
        chat:
          options:
            model: gemini-3.8-flash

# WHISPER VA AL MISMO NIVEL QUE SPRING Y SERVER
whisper:
  api:
    url: ${WHISPER_API_URL:http://localhost:8000/transcribir}

app:
  storage:
    grabaciones:
      path: ./uploads/grabaciones
