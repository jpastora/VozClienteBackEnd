server:
  port: 8070

spring:
  application:
    name: VozClienteBackEnd
  datasource:
    url: jdbc:postgresql://postgres-db:5432/voz_cliente_db
    username: postgres
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  docker:
    compose:
      file: docker/docker-compose.yml

  # Correo saliente (contraseña temporal). En desarrollo: Mailpit (docker-compose), sin autenticación,
  # bandeja en http://localhost:8025. Gmail real: ver docker/.env.example.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:sin-configurar}
            client-secret: ${GOOGLE_CLIENT_SECRET:sin-configurar}
            scope:
              - openid
              - profile
              - email

  # CONFIGURACIÓN DE SPRING AI (Google AI Studio)
  ai:
    retry:
      max-attempts: 5
      backoff:
        initial-interval: 2000ms
        multiplier: 2
        max-interval: 10000ms
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite

whisper:
  api:
    url: ${WHISPER_API_URL:http://localhost:8000/transcribir}

# Que un servidor de correo caído no marque la aplicación como no saludable.
management:
  health:
    mail:
      enabled: false

app:
  correo:
    remitente: ${MAIL_REMITENTE:vozclientebrightcodelab@gmail.com}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  seguridad:
    jwt-secreto: ${JWT_SECRET:}
    minutos-inactividad: ${APP_MINUTOS_INACTIVIDAD:30}
    cookie-segura: ${APP_COOKIE_SEGURA:false}
  storage:
    grabaciones:
      path: ${APP_STORAGE_GRABACIONES_PATH:./uploads/grabaciones}
